<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ESP32 相机 + 实时语音识别 + IMU 可视化</title>
<style>
  :root{
    --bg:#070b10; --card:#101720; --text:#e6edf3; --muted:#9fb0c3;
    --ok:#7ee787; --err:#ff8080; --warn:#ffd166; --line:#1f2937; --panel:rgba(16,23,32,.76);
  }
  *{box-sizing:border-box}
  html{height:100%; overflow:hidden}
  body{
    height:100%; overflow:hidden;
    margin:0; background:linear-gradient(180deg,#070b10,#0b1118 62%,#0d151f);
    color:var(--text);
    font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial;
  }

  /* 两栏布局 */
  .app{display:grid; grid-template-columns:minmax(0,1fr) clamp(360px, 27vw, 520px); gap:14px; height:100vh; padding:14px}
  .stage{
    position:relative; border:1px solid var(--line); border-radius:14px;
    min-width:0; min-height:0;
    height:100%;
    background:#020509; box-shadow:0 18px 50px rgba(0,0,0,.35); overflow:hidden;
  }
  .canvas-wrap, #canvas{
    position:absolute; inset:0; width:100%; height:100%; display:block;
    background:radial-gradient(circle at 50% 35%,#101922 0,#05080d 48%,#000 100%);
    z-index:10
  }
  .stage-empty{
    position:absolute; inset:0; z-index:18;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; text-align:center; color:var(--muted);
    background:
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size:42px 42px;
    pointer-events:none;
  }
  .stage-empty.is-hidden{display:none}
  .stage-empty strong{color:var(--text); font-size:22px; letter-spacing:0}
  .stage-empty span{font-size:14px}
  .stage-dot{width:12px; height:12px; border-radius:50%; background:var(--warn); box-shadow:0 0 22px rgba(255,209,102,.45)}
  .stage-status{
    position:absolute; left:14px; top:14px; z-index:30;
    display:flex; gap:8px; flex-wrap:wrap; align-items:center;
    max-width:calc(100% - 340px);
    pointer-events:none;
  }

  /* 右上角：参数 + 日志 */
  .tri-panels{
    position:absolute; right:12px; top:12px; z-index:30;
    display:grid; grid-template-columns: 1fr 1fr; gap:12px;
    max-width:min(720px, 60vw);
  }
  .box{
    border:2px dashed rgba(255,255,255,.35); border-radius:12px; padding:10px;
    background:var(--panel); backdrop-filter: blur(8px) saturate(130%);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
  }
  .box h4{margin:0 0 6px 0; font-size:12px; color:#ffd769}
  .kv{display:flex; justify-content:space-between; align-items:center;
      border-top:1px dashed rgba(255,255,255,.15); padding-top:6px; margin-top:6px; color:var(--muted); font-size:12px}

  /* 左上角 IMU 浮窗 —— 宽一些 + 横向布局：左模型 / 右数据 */
  .imu-float{
    position:absolute; right:14px; top:14px; z-index:35;
    width:min(300px, 34vw);
    height:190px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:12px;
    background:var(--panel);
    backdrop-filter: blur(10px) saturate(130%);
    box-shadow:0 14px 32px rgba(0,0,0,.34), inset 0 0 0 1px rgba(255,255,255,.04);
    padding:8px;
    overflow:hidden;
    transition: width .22s ease, height .22s ease, background .22s ease, box-shadow .22s ease, transform .22s ease;
  }
  .imu-float:hover,
  .imu-float:focus-within,
  .imu-float.is-expanded{
    width:min(52vw, 820px);
    height:min(52vh, 520px);
    background:rgba(10,16,24,.94);
    box-shadow:0 22px 60px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.06);
  }
  .imu-row{
    display:block;
    height:100%;
  }
  .imu-float:hover .imu-row,
  .imu-float:focus-within .imu-row,
  .imu-float.is-expanded .imu-row{
    display:grid;
    grid-template-columns:minmax(0, 1.25fr) minmax(270px, .75fr);
    gap:12px;
  }
  #imu_view{
    position:relative;
    height: 100%;
    min-height: 0;
    background:#081018; border-radius:10px;
  }
  #imu_hud{
  border-radius: 10px;
  background: rgba(8, 14, 22, 0.84);
  border: none;
  display:none;
  height:100%;
  overflow:hidden;
}
  .imu-float:hover #imu_hud,
  .imu-float:focus-within #imu_hud,
  .imu-float.is-expanded #imu_hud{
    display:block !important;
  }

#imu_hud::-webkit-scrollbar {
  width: 8px;  /* 滚动条的宽度 */
}

#imu_hud::-webkit-scrollbar-thumb {
  background-color: #2a6df4;  /* 滑块的颜色 */
  border-radius: 4px;  /* 滑块的圆角 */
}

#imu_hud::-webkit-scrollbar-track {
  background-color: #111a2e;  /* 滚动条轨道的颜色 */
  border-radius: 4px;  /* 滚动条轨道的圆角 */
}

  #imu_top_status{position:absolute; top:10px; right:10px; z-index:2}
  #imu_top_status .badge{background:rgba(0,0,0,.35); border-color:#2d3b50}

  /* 角标 + 当前指令（角标在浮窗下） */
  .badge-tag{
    position:absolute; left:12px; top: calc(12px + 300px + 28px); z-index:20;
    background:linear-gradient(120deg, rgba(47,134,255,.9), rgba(26,88,255,.9));
    color:#fff; padding:6px 10px; font-weight:700; font-size:12px; border-radius:999px;
    box-shadow:0 6px 16px rgba(47,134,255,.35)
  }
  .command{
    position:absolute; left:50%; bottom:46px; transform:translateX(-50%); z-index:25;
    display:flex; gap:10px; align-items:center; padding:12px 18px; border-radius:999px;
    background:rgba(18,24,33,.75); border:1px solid rgba(255,255,255,.14);
    backdrop-filter: blur(8px) saturate(140%); box-shadow:0 12px 28px rgba(0,0,0,.6)
  }
  .dot{width:9px; height:9px; border-radius:50%; background:#2f86ff; box-shadow:0 0 16px #2f86ff}

  /* 右侧聊天（左右气泡） */
  .chat {
    display: flex;
    flex-direction: column;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--card);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    overflow: hidden;
    height: 100%;
    min-width:0;
  }

  .chat-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
  .badges{display:flex;gap:10px;flex-wrap:wrap}
  .badge{font-size:12px;padding:4px 8px;border-radius:999px;border:1px solid #2d3b50;color:var(--muted);white-space:nowrap;background:rgba(7,11,16,.62);backdrop-filter:blur(6px)}
  .ok{color:var(--ok);border-color:var(--ok)} .err{color:var(--err);border-color:var(--err)} .warn{color:var(--warn);border-color:var(--warn)}
  .chat-list {
    flex: 1;
    overflow: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 0; /* 确保 .chat-list 不会被外部内容撑大 */
  }

  .config-panel{
    padding:12px;
    border:1px solid #203047;
    border-radius:12px;
    background:#0c121a;
  }
  .config-panel h2{margin:0 0 10px 0;font-size:14px;color:var(--muted);font-weight:700}
  .config-grid{display:grid;grid-template-columns:1fr;gap:8px}
  .config-section-title{
    margin:12px 0 2px 0;
    color:#d6e2f0;
    font-size:12px;
    font-weight:700;
  }
  .field-row{display:grid;grid-template-columns:92px minmax(0,1fr);gap:8px;align-items:center}
  .field-row label{font-size:12px;color:var(--muted)}
  .field-row input{
    width:100%; min-width:0;
    background:#071019; color:var(--text);
    border:1px solid #26364c; border-radius:8px;
    padding:7px 9px; font:12px/1.4 Consolas,monospace;
  }
  .config-actions{display:flex;gap:8px;margin-top:8px;align-items:center}
  .config-actions button{padding:7px 10px;border-radius:8px;font-size:12px}
  .mini-status{font-size:12px;color:var(--muted)}
  .endpoint-list{display:grid;gap:6px;margin-top:10px}
  .endpoint-row{
    display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:6px;align-items:center;
    padding:6px;border:1px solid #1b2a3e;border-radius:8px;background:#08111a;
  }
  .endpoint-row span{font-size:12px;color:var(--muted)}
  .endpoint-row code{font-size:11px;color:#d6e2f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .copy-btn{padding:5px 8px;border-radius:7px;background:#152337;border-color:#2b3e58;color:#c8d7e8;font-size:11px}

  .live{padding:12px;border:1px dashed #2d3b50;border-radius:12px;background:#0c121a}
  .live h2{margin:0 0 8px 0;font-size:14px;color:var(--muted);font-weight:600}
  .partial{font-size:20px;min-height:2.2em;letter-spacing:.2px}

  .finals {
    padding: 12px;
    border: 1px solid #1f2937;
    border-radius: 12px;
    background: #0c121a;
    display: flex;
    flex-direction: column;
    flex: 1; /* 使用 flex: 1 而不是 flex-grow: 1 */
    min-height: 0; /* 允许收缩到小于内容高度 */
  }
  .finals h2{margin:0 0 8px 0;font-size:14px;color:var(--muted);font-weight:600}
  .finals ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
  .bubble{max-width:82%; padding:10px 12px; border-radius:14px; border:1px solid #1f2937}
  .from-bot{align-self:flex-start; background:#0d1729}
  .from-me {align-self:flex-end;   background:#12263a}

  .controls{display:flex;gap:8px}
  button{background:#1f6feb;border:1px solid #1f6feb;color:#fff;border-radius:10px;padding:8px 12px;font-weight:600;cursor:pointer}
  .ghost{background:transparent;border-color:#304057;color:#9fb0c3}

  /* Modern console layout */
  .app{
    grid-template-columns:minmax(0,1fr) clamp(460px, 32vw, 640px);
    gap:12px;
    padding:12px;
    background:
      linear-gradient(135deg, rgba(82, 196, 255, 0.04), transparent 28%),
      linear-gradient(225deg, rgba(125, 235, 155, 0.03), transparent 32%),
      #05080d;
  }
  .stage{
    border-radius:12px;
    border-color:#1b2736;
    box-shadow:0 18px 48px rgba(0,0,0,.34);
  }
  .stage-status{
    left:12px;
    top:12px;
    max-width:calc(100% - 340px);
    gap:6px;
  }
  .chat{
    background:linear-gradient(180deg, rgba(12,18,26,.98), rgba(8,12,18,.98));
    border-color:#203146;
    border-radius:12px;
  }
  .chat-head{
    display:grid;
    grid-template-columns:minmax(0,1fr) 74px;
    gap:8px;
    align-items:start;
    padding:10px 12px;
    border-bottom:1px solid #203146;
    background:rgba(10,15,22,.86);
  }
  .badges{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    align-content:flex-start;
    max-height:86px;
    overflow:auto;
    padding-right:2px;
  }
  .badge{
    font-size:11px;
    line-height:1.2;
    padding:5px 8px;
    border-radius:999px;
    border:1px solid #31445d;
    background:rgba(7,11,16,.74);
  }
  .controls{
    display:grid;
    grid-template-columns:1fr;
    gap:6px;
    align-items:start;
  }
  .controls button{
    width:74px;
    min-height:34px;
    padding:7px 8px;
    border-radius:8px;
    font-size:12px;
  }
  .chat-list{
    padding:10px;
    gap:10px;
    overflow:hidden;
    display:grid;
    grid-template-rows:auto minmax(120px, .34fr) minmax(260px, 1fr);
  }
  .config-panel{
    padding:0;
    border:1px solid #203047;
    border-radius:10px;
    background:#0b1119;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,.16);
  }
  .config-panel summary{
    list-style:none;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:10px 12px;
    color:#d7e2ee;
    font-size:13px;
    font-weight:700;
    border-bottom:1px solid #1b2a3e;
    background:linear-gradient(180deg, rgba(14,20,28,.96), rgba(9,14,20,.96));
  }
  .config-panel summary::-webkit-details-marker{display:none}
  .config-panel summary::after{
    content:"▸";
    color:#9fb0c3;
    transition:transform .2s ease;
  }
  .config-panel[open] summary::after{transform:rotate(90deg)}
  .config-panel summary small{
    color:var(--muted);
    font-size:11px;
    font-weight:500;
  }
  .config-body{
    padding:10px 12px 12px;
    max-height:min(42vh, 440px);
    overflow:auto;
  }
  .config-grid{gap:6px}
  .config-section-title{margin:10px 0 2px}
  .field-row{
    gap:8px;
    grid-template-columns:78px minmax(0,1fr);
  }
  .field-row input{
    height:34px;
    padding:7px 9px;
    border-radius:8px;
    background:#07101a;
  }
  .config-actions{
    margin-top:10px;
    flex-wrap:wrap;
  }
  .config-actions button{
    padding:7px 10px;
    border-radius:8px;
    font-size:12px;
  }
  .endpoint-list{gap:6px;margin-top:10px}
  .endpoint-row{
    padding:6px 8px;
    border-radius:8px;
    grid-template-columns:70px minmax(0,1fr) auto;
    background:#08111a;
  }
  .live,
  .finals{
    border-radius:10px;
    background:#0b1119;
    border-color:#1e2d40;
    min-height:0;
  }
  .live{
    padding:10px 12px;
    border-style:dashed;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  .live h2,
  .finals h2{
    font-size:12px;
    letter-spacing:.03em;
    text-transform:uppercase;
  }
  .partial{
    font-size:18px;
    line-height:1.45;
    min-height:2.3em;
    overflow:auto;
    padding-right:4px;
  }
  .finals{
    padding:10px;
    overflow:hidden;
  }
  .finals ul{
    gap:8px;
    overflow:auto;
    padding-right:4px;
  }
  .bubble{
    max-width:88%;
    border-radius:10px;
    padding:10px 12px;
  }
  #cameraWsText,#audioWsText,#imuUdpText{
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .chat-list::-webkit-scrollbar,
  .config-body::-webkit-scrollbar,
  #chatContainer::-webkit-scrollbar{width:6px}
  .chat-list::-webkit-scrollbar-thumb,
  .config-body::-webkit-scrollbar-thumb,
  #chatContainer::-webkit-scrollbar-thumb{background:#2a3446;border-radius:999px}

  /* 隐藏但保留：校准/滑杆（供 main.js 使用） */
  .hidden-controls{display:none}

  @media (max-width:1100px){
    .app{grid-template-columns:1fr; grid-template-rows:minmax(420px, 62vh) minmax(260px, 38vh); height:100vh}
    .stage{height:100%; min-height:420px}
    .chat{height:100%; min-height:0}
    body, html{overflow:auto}
    .imu-float{width:min(300px, calc(100vw - 56px)); height:170px}
    .imu-float:hover,
    .imu-float:focus-within,
    .imu-float.is-expanded{width:calc(100vw - 56px); height:min(58vh, 520px)}
    .imu-float:hover .imu-row,
    .imu-float:focus-within .imu-row,
    .imu-float.is-expanded .imu-row{grid-template-columns:minmax(0, 1fr) minmax(250px, .8fr)}
    .imu-float:hover #imu_hud,
    .imu-float:focus-within #imu_hud,
    .imu-float.is-expanded #imu_hud{display:block !important}
  }
</style>
</head>
<body>

<div class="app">
  <!-- 左侧主舞台 -->
  <section class="stage">
    <div class="canvas-wrap"><canvas id="canvas"></canvas></div>
    <div id="stageEmpty" class="stage-empty">
      <div class="stage-dot"></div>
      <strong>等待摄像头设备</strong>
      <span>后端已运行，ESP32 摄像头尚未接入</span>
    </div>
    <div class="stage-status">
      <span id="camStatusStage" class="badge warn">Camera HW: waiting</span>
      <span id="audioStatusStage" class="badge warn">Audio HW: waiting</span>
      <span id="yoloStatusStage" class="badge">YOLO: idle</span>
    </div>

    <!-- 左上角：IMU 浮窗（横向） -->
    <div class="imu-float">
      <div class="imu-row">
        <div id="imu_view"></div>
        <div id="imu_hud"><!-- JS 会把“IMU 实时数据面板”插到这里 --></div>
      </div>
      <div id="imu_top_status" style="display: none;">
        <span class="badge">UDP: <code>12345</code></span>
        <span class="badge">Browser WS: <code>/ws</code></span>
        <span class="badge" id="imu_ws_state">connecting…</span>
      </div>
    </div>



  </section>

  <!-- 右侧聊天 -->
  <aside class="chat">
    <div class="chat-head">
      <div class="badges">
        <span id="camStatus" class="badge">Viewer: connecting…</span>
        <span id="asrStatus" class="badge">UI: connecting…</span>
        <span id="modeStatus" class="badge">Mode: --</span>
        <span id="speakerStatus" class="badge">Speaker: --</span>
        <span id="yoloStatus" class="badge">YOLO: idle</span>
        <span id="fps" class="badge">FPS: --</span>
      </div>
      <div class="controls">
        <button class="ghost" id="btnClear">清空 Final</button>
        <button id="btnReconnect">重连</button>
      </div>
    </div>
    <div class="chat-list">
      <details class="config-panel">
        <summary><span>设备接入 / 运行配置</span><small>地址、密钥、模型路径</small></summary>
        <div class="config-body">
        <div class="config-grid">
          <div class="field-row">
            <label for="serverHostInput">服务 IP</label>
            <input id="serverHostInput" type="text" list="serverHostOptions" placeholder="例如 192.168.1.10">
            <datalist id="serverHostOptions"></datalist>
          </div>
          <div class="field-row">
            <label for="dashscopeKeyInput">API Key</label>
            <input id="dashscopeKeyInput" type="password" placeholder="DASHSCOPE_API_KEY">
          </div>
          <div class="config-section-title">模型路径</div>
          <div class="field-row">
            <label for="blindPathModelInput">盲道分割</label>
            <input id="blindPathModelInput" type="text" placeholder="model/yolo-seg.pt">
          </div>
          <div class="field-row">
            <label for="obstacleModelInput">障碍 YOLOE</label>
            <input id="obstacleModelInput" type="text" placeholder="model/yoloe-11l-seg.pt">
          </div>
          <div class="field-row">
            <label for="itemModelInput">找物 YOLOE</label>
            <input id="itemModelInput" type="text" placeholder="model/yoloe-11l-seg.pt">
          </div>
          <div class="field-row">
            <label for="trafficModelInput">红绿灯</label>
            <input id="trafficModelInput" type="text" placeholder="model/trafficlight.pt">
          </div>
          <div class="field-row">
            <label for="handTaskInput">手势模型</label>
            <input id="handTaskInput" type="text" placeholder="model/hand_landmarker.task">
          </div>
        </div>
        <div class="config-actions">
          <button id="btnSaveRuntime">保存配置</button>
          <span id="runtimeConfigStatus" class="mini-status">读取配置中…</span>
        </div>
        <div class="endpoint-list">
          <div class="endpoint-row"><span>摄像头</span><code id="cameraWsText">-</code><button class="copy-btn" data-copy-target="cameraWsText">复制</button></div>
          <div class="endpoint-row"><span>音频</span><code id="audioWsText">-</code><button class="copy-btn" data-copy-target="audioWsText">复制</button></div>
          <div class="endpoint-row"><span>IMU UDP</span><code id="imuUdpText">-</code><button class="copy-btn" data-copy-target="imuUdpText">复制</button></div>
        </div>
        </div>
      </details>
      <div class="live">
        <h2>流式识别（Partial）</h2>
        <div class="partial" id="partial">（等待音频…）</div>
      </div>
      <div class="finals">
        <h2>最终文本（Final）</h2>
        <ul id="finalList"></ul>
      </div>
    </div>
  </aside>
</div>

<!-- 隐藏但保留：校准/滑杆（供 main.js 使用） -->
<div class="hidden-controls">
  <button id="btn_zero"></button><button id="btn_reset"></button><button id="btn_bias_now"></button>
  <input id="auto_rezero" type="checkbox" checked /><input id="auto_bias" type="checkbox" checked />
  <input id="use_proj" type="checkbox" checked /><input id="freeze_still" type="checkbox" checked />
  <select id="medn"><option>3</option><option selected>5</option><option>7</option></select>
